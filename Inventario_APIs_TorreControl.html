<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gobierno Centralizado de APIs · Consola de Inventario</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --ink:#0F2A3D;
  --ink-2:#16374B;
  --slate:#3D5568;
  --slate-soft:#6B8194;
  --paper:#EEF3F5;
  --paper-2:#FFFFFF;
  --line:#CBD6DC;
  --line-soft:#DEE6EA;
  --gold:#B8862E;
  --gold-dark:#93691F;
  --gold-tint:#F3E4C4;
  --ok:#2F7A56;
  --ok-tint:#DEEEE4;
  --warn:#C98A2C;
  --warn-tint:#F5E7CE;
  --bad:#B0392F;
  --bad-tint:#F5DFDC;
  --info:#2B5F8A;
  --info-tint:#DCE8F2;
  --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --disp:'Space Grotesk', var(--sans);
  --radius:4px;
  --shadow: 0 1px 2px rgba(15,42,61,.06), 0 4px 16px rgba(15,42,61,.05);
}



*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
}
::selection{background:var(--gold-tint);}

/* blueprint grid texture on the shell background */
.app{
  min-height:100vh;
  display:flex;
  background-image:
    linear-gradient(rgba(15,42,61,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(15,42,61,.035) 1px, transparent 1px);
  background-size: 28px 28px;
}

/* ============================================================
   SIDEBAR
   ============================================================ */
.sidebar{
  width:250px;
  flex:0 0 250px;
  background:var(--ink);
  color:#CFE0EA;
  display:flex;
  flex-direction:column;
  position:sticky;
  top:0;
  height:100vh;
}
.brand{
  padding:22px 20px 16px;
  border-bottom:1px solid rgba(255,255,255,.09);
}
.brand .mark{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.14em;
  color:var(--gold-tint);
  text-transform:uppercase;
}
.brand h1{
  font-family:var(--disp);
  font-size:17px;
  font-weight:600;
  margin:6px 0 2px;
  color:#fff;
  letter-spacing:-.01em;
}
.brand p{
  margin:0;
  font-size:11.5px;
  color:#8CA6B7;
}
nav.tabs{
  flex:1;
  overflow-y:auto;
  padding:10px 10px 10px;
}
.tab-group-label{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:#5E7C90;
  padding:14px 10px 6px;
}
.tab-btn{
  display:flex;
  align-items:baseline;
  gap:9px;
  width:100%;
  text-align:left;
  background:transparent;
  border:none;
  color:#B9CBD7;
  padding:8px 10px;
  border-radius:4px;
  cursor:pointer;
  font-size:13px;
  font-family:var(--sans);
  margin-bottom:1px;
}
.tab-btn .num{
  font-family:var(--mono);
  font-size:10.5px;
  color:#5E7C90;
  min-width:16px;
}
.tab-btn:hover{background:rgba(255,255,255,.06); color:#fff;}
.tab-btn.active{background:rgba(184,134,46,.16); color:#F3E4C4;}
.tab-btn.active .num{color:var(--gold-tint);}
.tab-btn:disabled{opacity:.35; cursor:not-allowed;}
.tab-btn:disabled:hover{background:transparent; color:#B9CBD7;}

.sidebar-foot{
  padding:14px 16px 18px;
  border-top:1px solid rgba(255,255,255,.09);
}
.sync-line{
  margin-top:12px;
  font-size:10.5px;
  color:#5E7C90;
  display:flex;
  align-items:center;
  gap:6px;
}
.dot{width:6px;height:6px;border-radius:50%;background:#5E7C90;flex:0 0 auto;}
.dot.on{background:#4CAF7D;}

/* ============================================================
   MAIN
   ============================================================ */
.main{
  flex:1;
  min-width:0;
  padding:26px 34px 60px;
}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:16px;
  margin-bottom:22px;
  flex-wrap:wrap;
}
.topbar h2{
  font-family:var(--disp);
  font-size:22px;
  margin:0 0 4px;
  letter-spacing:-.01em;
}
.topbar .sub{color:var(--slate-soft); font-size:13px; max-width:640px;}
.file-actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}

button.btn{
  font-family:var(--sans);
  font-weight:600;
  font-size:12.5px;
  border-radius:4px;
  border:1px solid var(--line);
  background:var(--paper-2);
  color:var(--ink);
  padding:9px 14px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:7px;
}
button.btn:hover{border-color:var(--slate-soft);}
button.btn.primary{background:var(--ink); color:#fff; border-color:var(--ink);}
button.btn.primary:hover{background:var(--ink-2);}
button.btn.gold{background:var(--gold); border-color:var(--gold); color:#fff;}
button.btn.gold:hover{background:var(--gold-dark);}
button.btn.ghost{background:transparent; border-color:transparent; color:var(--slate);}
button.btn.ghost:hover{background:var(--line-soft);}
button.btn.danger{color:var(--bad); border-color:var(--bad-tint); background:var(--bad-tint);}
button.btn:disabled{opacity:.45; cursor:not-allowed;}
button.btn.small{padding:5px 9px; font-size:11.5px;}
input[type=file]{display:none;}

.card{
  background:var(--paper-2);
  border:1px solid var(--line-soft);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
  margin-bottom:18px;
}
.card h3{
  font-family:var(--disp);
  font-size:15px;
  margin:0 0 4px;
}
.card .hint{color:var(--slate-soft); font-size:12.5px; margin-bottom:14px;}

/* KPI grid */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:18px;}
.kpi{
  background:var(--paper-2);
  border:1px solid var(--line-soft);
  border-left:3px solid var(--gold);
  border-radius:var(--radius);
  padding:14px 16px;
  box-shadow:var(--shadow);
}
.kpi .n{font-family:var(--disp); font-size:26px; font-weight:600; line-height:1;}
.kpi .l{font-size:11.5px; color:var(--slate-soft); margin-top:6px; text-transform:uppercase; letter-spacing:.04em;}

.two-col{display:grid; grid-template-columns:1.3fr .9fr; gap:18px;}
@media (max-width:980px){.two-col{grid-template-columns:1fr;}}

.barlist{display:flex; flex-direction:column; gap:9px;}
.barrow{display:grid; grid-template-columns:120px 1fr 34px; align-items:center; gap:8px; font-size:12px;}
.barrow .lbl{color:var(--slate); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.barrow .track{background:var(--paper); border-radius:3px; height:9px; overflow:hidden;}
.barrow .fill{height:100%; background:var(--gold); border-radius:3px;}
.barrow .val{text-align:right; font-family:var(--mono); color:var(--slate);}

/* Tables */
.table-wrap{overflow:auto; border:1px solid var(--line-soft); border-radius:var(--radius);}
table{width:100%; border-collapse:collapse; font-size:12.5px;}
thead th{
  position:sticky; top:0;
  background:var(--ink);
  color:#DCE8EE;
  text-align:left;
  padding:9px 10px;
  font-weight:600;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.03em;
  white-space:nowrap;
}
tbody td{
  padding:8px 10px;
  border-bottom:1px solid var(--line-soft);
  white-space:nowrap;
  max-width:260px;
  overflow:hidden;
  text-overflow:ellipsis;
}
tbody tr:hover{background:#F5F8F9;}
tbody tr:nth-child(even){background:#FAFCFC;}
tbody tr:nth-child(even):hover{background:#F5F8F9;}
td.wrap, th.wrap{white-space:normal;}
.rowbtn{cursor:pointer; color:var(--info); font-weight:600; background:none; border:none; padding:0; font-size:12.5px; font-family:var(--sans);}
.rowbtn:hover{text-decoration:underline;}
.empty-state{padding:34px 18px; text-align:center; color:var(--slate-soft);}
.empty-state .big{font-family:var(--disp); font-size:15px; color:var(--slate); margin-bottom:4px;}

/* Badges (stamps) */
.badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 9px;
  border-radius:20px;
  font-size:10.5px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.03em;
  font-family:var(--mono);
  white-space:nowrap;
}
.badge.ok{background:var(--ok-tint); color:var(--ok);}
.badge.warn{background:var(--warn-tint); color:var(--warn);}
.badge.bad{background:var(--bad-tint); color:var(--bad);}
.badge.info{background:var(--info-tint); color:var(--info);}
.badge.neutral{background:var(--line-soft); color:var(--slate);}
code.idtag{font-family:var(--mono); background:var(--paper); border:1px solid var(--line-soft); border-radius:3px; padding:1px 6px; font-size:11.5px;}

/* Forms */
.form-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px 18px;}
.form-grid.g3{grid-template-columns:repeat(3,1fr);}
@media (max-width:760px){.form-grid, .form-grid.g3{grid-template-columns:1fr;}}
.field{display:flex; flex-direction:column; gap:5px;}
.field.span2{grid-column:span 2;}
.field.span3{grid-column:1/-1;}
.field label{font-size:11.5px; font-weight:600; color:var(--slate); display:flex; justify-content:space-between;}
.field label .req{color:var(--bad); font-weight:700;}
.field input, .field select, .field textarea{
  font-family:var(--sans);
  font-size:13px;
  padding:8px 10px;
  border:1px solid var(--line);
  border-radius:4px;
  background:var(--paper-2);
  color:var(--ink);
}
.field input:focus, .field select:focus, .field textarea:focus{
  outline:2px solid var(--gold-tint);
  border-color:var(--gold);
}
.field textarea{resize:vertical; min-height:56px; font-family:var(--sans);}
.field .fhint{font-size:11px; color:var(--slate-soft);}
.field input[readonly]{background:var(--paper); color:var(--slate);}

fieldset.section{
  border:1px solid var(--line-soft);
  border-radius:var(--radius);
  padding:16px;
  margin:0 0 16px;
}
fieldset.section legend{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--gold-dark);
  padding:0 6px;
}

.subtable-row{display:grid; grid-template-columns:repeat(5,1fr) 32px; gap:8px; margin-bottom:8px; align-items:center;}
.subtable-head{display:grid; grid-template-columns:repeat(5,1fr) 32px; gap:8px; margin-bottom:6px;}
.subtable-head span{font-size:10.5px; text-transform:uppercase; color:var(--slate-soft); font-weight:600;}
.iconbtn{border:1px solid var(--line); background:var(--paper-2); border-radius:4px; width:30px; height:30px; cursor:pointer; color:var(--bad); font-size:14px; line-height:1;}
.iconbtn:hover{background:var(--bad-tint);}

.formbar{display:flex; justify-content:flex-end; gap:10px; margin-top:6px;}

.alert{
  border-radius:4px;
  padding:12px 14px;
  font-size:12.5px;
  margin-bottom:14px;
  display:flex;
  gap:10px;
  align-items:flex-start;
}
.alert.warn{background:var(--warn-tint); color:#7A5416; border:1px solid #E4C481;}
.alert.info{background:var(--info-tint); color:#1E4162; border:1px solid #A9C6DD;}
.alert.ok{background:var(--ok-tint); color:#1E5A3C; border:1px solid #9FCBB2;}
.alert.bad{background:var(--bad-tint); color:#7C2620; border:1px solid #E0A9A3;}
.alert b{font-weight:700;}
.alert ul{margin:6px 0 0; padding-left:18px;}

.search-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center;}
.search-row input[type=search]{
  flex:1; min-width:200px;
  padding:9px 12px;
  border:1px solid var(--line);
  border-radius:4px;
  font-size:13px;
  background:var(--paper-2);
}
.search-row select{padding:9px 10px; border:1px solid var(--line); border-radius:4px; font-size:12.5px; background:var(--paper-2);}
.chips{display:flex; gap:6px; flex-wrap:wrap;}
.chip{
  border:1px solid var(--line);
  background:var(--paper-2);
  border-radius:20px;
  padding:6px 13px;
  font-size:12px;
  cursor:pointer;
  color:var(--slate);
  font-weight:600;
}
.chip:hover{border-color:var(--gold);}
.chip.active{background:var(--ink); color:#fff; border-color:var(--ink);}

.stepline{
  display:flex; align-items:center; gap:6px; margin-bottom:16px; font-family:var(--mono); font-size:11px; color:var(--slate-soft);
}
.stepline b{color:var(--gold-dark);}

.section-title{
  font-family:var(--disp); font-size:13px; font-weight:600; margin:20px 0 10px; color:var(--ink);
  display:flex; align-items:center; gap:8px;
}
.section-title::after{content:''; flex:1; height:1px; background:var(--line-soft);}

.tag-list{display:flex; gap:6px; flex-wrap:wrap; margin-top:4px;}
.tag-list .tag{background:var(--paper); border:1px solid var(--line-soft); border-radius:3px; padding:2px 7px; font-size:11px; font-family:var(--mono); color:var(--slate);}

.trace{border-left:2px solid var(--line); margin-left:6px; padding-left:18px;}
.trace-item{position:relative; padding:2px 0 18px;}
.trace-item::before{content:''; position:absolute; left:-23px; top:4px; width:9px; height:9px; border-radius:50%; background:var(--gold); border:2px solid var(--paper-2);}
.trace-item .th{font-weight:700; font-size:12.5px; display:flex; gap:8px; align-items:center;}
.trace-item .tm{font-size:11.5px; color:var(--slate-soft); margin-top:2px;}
.trace-item .tc{font-size:12px; margin-top:4px; color:var(--ink);}

.modal-backdrop{
  position:fixed; inset:0; background:rgba(15,42,61,.55); display:none;
  align-items:center; justify-content:center; z-index:50; padding:20px;
}
.modal-backdrop.show{display:flex;}
.modal{background:var(--paper-2); border-radius:6px; max-width:640px; width:100%; max-height:86vh; overflow:auto; padding:22px 24px; box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal h3{font-family:var(--disp); margin-top:0;}

.toast-wrap{position:fixed; bottom:20px; right:20px; z-index:80; display:flex; flex-direction:column; gap:8px;}
.toast{
  background:var(--ink); color:#fff; padding:11px 16px; border-radius:5px; font-size:12.5px;
  box-shadow:0 8px 24px rgba(0,0,0,.25); display:flex; gap:8px; align-items:center;
  border-left:3px solid var(--gold);
  animation:slidein .18s ease-out;
}
.toast.bad{border-left-color:var(--bad);}
.toast.ok{border-left-color:var(--ok);}
@keyframes slidein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.guide{max-width:760px;}
.guide h4{font-family:var(--disp); font-size:14px; margin:20px 0 6px;}
.guide p, .guide li{color:var(--slate); font-size:13px;}
.guide .example{background:var(--paper); border:1px dashed var(--line); border-radius:4px; padding:12px 14px; font-size:12.5px; color:var(--ink);}

.role-note{font-size:11.5px; color:var(--slate-soft); display:flex; align-items:center; gap:6px; margin-bottom:14px;}

.pill-role{font-family:var(--mono); font-size:10px; background:var(--paper); border:1px solid var(--line-soft); padding:2px 8px; border-radius:20px; color:var(--slate);}

@media print{.sidebar,.file-actions,.formbar{display:none;}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modalBody"></div></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* ==================================================================================
   MODELO DE DATOS — refleja 1:1 las hojas del Excel maestro
   ================================================================================== */
const SHEETS = {
  apis: 'Catálogo_APIs',
  ops: 'Catálogo_Operaciones_API',
  hist: 'Histórico_Proyectos_API',
  deps: 'Dependencias_API',
  listas: 'Listas_Validacion'
};

const HEADERS = {
  apis: ["ID API","País","Nombre API","Descripción","Tipo de Componente","Tipo API","Business Area","Business Domain","Service Domain","Complejidad","Estilo Diseño","Canal Integración (Despliegue)","URL OpenAPI (SWAGGER)","Versión Actual","Fecha de Registro","Estado_General_API","Service Owner","Estado de Gobierno","Existe en Catálogo BIAN","Posible Duplicado en Backlog","Caso de Uso","Repositorios Involucrados","Excepción / Riesgo Identificado"],
  ops: ["ID Operación","ID API","Método HTTP","Path - Endpoint","Descripción Operación","Versión Desde","Estado Operación"],
  hist: ["ID Historial","ID API","Proyecto","Tribu","Acción","Operaciones (Creadas/Modificadas)","PO/Líder Usuario","TTL","Jefe Proyecto","Líder Técnico","Arquitecto Solución","Consumidores","Fecha Registro","Fecha Fin Diseño","Fecha Pase Desarrollo","Fecha Pase QA","Fecha Pase Producción","Quarter Publicación","Estado_Actual","Versión_Antes","Versión_Después","Breaking_Change","Complejidad","Justificación_Complejidad","Última_Modificación_Por","Fecha_Última_Modificación","Motivo_Modificación","Observaciones_Cruce","Comentarios","Etapa Planificación","Fecha Fin Planificación","Etapa Diseño","Etapa Desarrollo","Etapa Calidad","Etapa Producción","Estado de Validación","Observación Torre de Control","Fecha Validación"],
  deps: ["ID_API_Consumidor","Nombre_API_Consumidor","Tipo_Artefacto_Consumido","ID_API_Consumida","Nombre_API_Consumida","Tipo_Dependencia","Criticidad","Comentarios"],
  listas: ["Pais","TipoAPI_BIAN","EstadoGeneralAPI","CriticidadBIAN","ProtocoloEstilo","CanalIntegracion","MetodoHTTP","EstadoOperacion","EquipoPropietario","Accion","EstadoActual","Complejidad","BreakingChange","TipoDependencia","Criticidad","SiNo","EstadoGobierno","EtapaEstado","EstadoValidacion","TipoArtefactoConsumido","TipoComponente"]
};

const DEFAULT_LISTS = {
  Pais:["Perú","Colombia","Otro"],
  TipoAPI_BIAN:["EXP","PROC","SD","SYS"],
  EstadoGeneralAPI:["Activa","En Desarrollo","En Mantenimiento","Deprecada"],
  CriticidadBIAN:["Alta","Media","Baja"],
  ProtocoloEstilo:["REST","Evento","GraphQL","SOAP","Otro"],
  CanalIntegracion:["APIM","AKS","Azure Event Hub","OCP","CA"],
  MetodoHTTP:["GET","POST","PUT","PATCH","DELETE"],
  EstadoOperacion:["Activa","Deprecada"],
  EquipoPropietario:["Interconexión","Core / Legado","Otro"],
  Accion:["Creación","Modificación","Reutilización"],
  EstadoActual:["Identificado","Backlog","Diseño","Desarrollo","Calidad","Producción","Deprecada"],
  Complejidad:["Baja","Media","Alta"],
  BreakingChange:["Sí","No"],
  TipoDependencia:["Síncrona (REST)","Asíncrona (Evento/Kafka)"],
  Criticidad:["Crítica","Alta","Media","Baja"],
  SiNo:["Sí","No"],
  EstadoGobierno:["Aprobado - creación nueva","Aprobado - modificación sobre API existente","Aprobado - reutilización","Pendiente de definición","Revisar - posible duplicado en backlog","Revisar - ya existe en catálogo BIAN, evaluar reutilización"],
  EtapaEstado:["No iniciado","En proceso","Finalizado","Desestimada"],
  EstadoValidacion:["Registrado","Observado","Corregido","Publicado"],
  TipoArtefactoConsumido:["Componente del Catálogo","Microservicio","Evento / Topic","Batch / Job","Sistema Legado / Otro"],
  TipoComponente:["API","Microservicio","Tópico / Evento","Batch / Job","Sistema Legado / Otro"]
};

/* ==================================================================================
   NOTIFICACIÓN A LA TORRE DE CONTROL (vía relay serverless -> GitHub Actions -> correo)
   Esta página es estática (GitHub Pages) y no puede llamar a la API de GitHub de forma
   segura por sí sola — necesitaría un token con permisos de escritura visible en el código
   fuente. Por eso se llama a un relay (Cloudflare Worker) que NO expone ningún secreto al
   navegador; el relay es quien guarda el token y dispara el evento repository_dispatch que
   activa el workflow de GitHub Actions encargado de enviar el correo.
   Reemplaza NOTIFY_RELAY_URL por la URL real de tu Worker una vez desplegado (ver
   instrucciones de despliegue). Mientras contenga "TU-SUBDOMINIO" la notificación se omite
   silenciosamente y el resto de la app sigue funcionando con normalidad.
   ================================================================================== */
const NOTIFY_RELAY_URL = 'https://inventario-apis-notify-relay.TU-SUBDOMINIO.workers.dev';

/* ==================================================================================
   EXCEL COMO FUENTE UNICA DE VERDAD EN GITHUB
   El Excel oficial vive en el mismo repositorio que este HTML (repo publico), en la ruta
   GITHUB_DATA_PATH. Al abrir la app se lee directo desde la API de contenidos de GitHub
   (lectura anonima, sin token, porque el repo es publico). Para GUARDAR si hace falta el
   mismo relay (Worker) que ya usamos para las notificaciones, porque escribir requiere un
   token con permiso de escritura que no puede vivir en una pagina publica.
   Reemplaza GITHUB_OWNER/GITHUB_REPO por los datos reales de tu repositorio (ver
   instrucciones de despliegue). Mientras contengan los valores de ejemplo, la app sigue
   funcionando con Importar/Exportar manual de Excel como hasta ahora.
   ================================================================================== */
const GITHUB_OWNER = 'upndmarrujo';
const GITHUB_REPO = 'inventario-apis-v2';
const GITHUB_BRANCH = 'main';
const GITHUB_DATA_PATH = 'data/inventario.xlsx';
function githubConfigured(){
  return !!(GITHUB_OWNER && !GITHUB_OWNER.includes('upndmarrujo') && GITHUB_REPO && !GITHUB_REPO.includes('inventario-apis-v2'));
}
function relayConfigured(){
  return !!(NOTIFY_RELAY_URL && !NOTIFY_RELAY_URL.includes('TU-SUBDOMINIO'));
}
function base64ToArrayBuffer(b64){
  const binary = atob(b64.replace(/\n/g,''));
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}
function arrayBufferToBase64(buf){
  const bytes = new Uint8Array(buf);
  let binary = '';
  const chunk = 0x8000;
  for(let i=0;i<bytes.length;i+=chunk){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
  }
  return btoa(binary);
}
async function loadFromGitHub(){
  if(!githubConfigured()) return false;
  try{
    const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_DATA_PATH}?ref=${GITHUB_BRANCH}&_=${Date.now()}`;
    const resp = await fetch(url, {headers:{Accept:'application/vnd.github+json'}});
    if(!resp.ok){ console.warn('[loadFromGitHub] No se pudo leer el Excel del repositorio', resp.status); return false; }
    const json = await resp.json();
    if(!json.content){ console.warn('[loadFromGitHub] Respuesta sin contenido', json); return false; }
    loadWorkbookFromArrayBuffer(base64ToArrayBuffer(json.content), GITHUB_DATA_PATH.split('/').pop());
    GITHUB_FILE_SHA = json.sha;
    META.lastGitHubLoad = new Date().toISOString();
    return true;
  }catch(e){
    console.warn('[loadFromGitHub] Error de red al leer el Excel del repositorio', e);
    return false;
  }
}
async function actualizarDesdeGitHub(){
  if(PENDING_BATCH.length){
    const ok = confirm(`Tienes ${PENDING_BATCH.length} componente(s) sin enviar a la Torre de Control. Si actualizas ahora desde GitHub vas a perder esos cambios locales. ¿Continuar de todas formas?`);
    if(!ok) return;
  }
  const ok = await loadFromGitHub();
  if(ok){ PENDING_BATCH=[]; scheduleSave(); toast('Excel actualizado con la version mas reciente de GitHub.','ok'); renderApp(); }
  else toast('No se pudo actualizar desde GitHub. Revisa tu conexion.','bad');
}
async function syncToGitHub(batchForEmail){
  if(!githubConfigured()){ toast('La conexion con GitHub no esta configurada todavia. Ver instrucciones de despliegue.','bad'); return false; }
  if(!relayConfigured()){ toast('El relay de sincronizacion no esta configurado todavia. Ver instrucciones de despliegue.','bad'); return false; }
  GITHUB_SYNCING = true; renderApp();
  try{
    const wb = buildWorkbook();
    const buf = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    const contentBase64 = arrayBufferToBase64(buf);
    const resumen = (batchForEmail||[]).map(it=>`- ${it.tipoComponente||''} ${it.id} · ${it.nombre} (${it.accion}) — proyecto ${it.proyecto||'—'}, arquitecto ${it.arquitecto||'—'}`).join('\n') || '(sin detalle de items)';
    const resp = await fetch(NOTIFY_RELAY_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        type: 'sync',
        path: GITHUB_DATA_PATH,
        branch: GITHUB_BRANCH,
        contentBase64,
        expectedSha: GITHUB_FILE_SHA,
        notify: !!(batchForEmail && batchForEmail.length),
        batch: batchForEmail||[],
        resumen
      })
    });
    const data = await resp.json().catch(()=>({}));
    if(resp.status===409){
      toast('Alguien mas guardo el Excel en GitHub antes que tu. Presiona "Actualizar desde GitHub" para traer la version mas reciente y vuelve a intentar.','bad');
      return false;
    }
    if(!resp.ok){
      toast('No se pudo guardar en GitHub: '+(data.error||resp.status),'bad');
      return false;
    }
    GITHUB_FILE_SHA = data.newSha || GITHUB_FILE_SHA;
    META.lastGitHubSave = new Date().toISOString();
    return true;
  }catch(e){
    console.error(e);
    toast('No se pudo contactar al relay para guardar en GitHub.','bad');
    return false;
  }finally{
    GITHUB_SYNCING = false; renderApp();
  }
}
async function enviarATorreControl(){
  if(!PENDING_BATCH.length){ toast('No hay componentes pendientes de enviar.','info'); return; }
  const batch = PENDING_BATCH.slice();
  const ok = await syncToGitHub(batch);
  if(ok){
    PENDING_BATCH = [];
    scheduleSave();
    toast(`${batch.length} componente(s) guardado(s) en el Excel oficial de GitHub y notificado(s) por correo a la Torre de Control.`,'ok');
    renderApp();
  }
}
function syncGovernanceAction(){
  syncToGitHub([]).then(ok=>{ if(ok) toast('Cambio guardado en el Excel oficial de GitHub.','ok'); });
}

function fmtDate(v){
  if(!v) return '';
  if(v instanceof Date) return v.toISOString().slice(0,10);
  if(typeof v === 'string'){
    if(/^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0,10);
    const d = new Date(v);
    if(!isNaN(d)) return d.toISOString().slice(0,10);
    return v; // e.g. 'TBD'
  }
  return String(v);
}
function computeQuarter(fechaProd){
  const f = fmtDate(fechaProd);
  if(!f || !/^\d{4}-\d{2}-\d{2}/.test(f)) return '';
  const d = new Date(f);
  const q = Math.ceil((d.getUTCMonth()+1)/3);
  return 'Q'+q+'-'+d.getUTCFullYear();
}

function nextSeqId(list, field, fallbackPrefix, pad){
  let best = null;
  for(const row of list){
    const v = row[field];
    if(!v) continue;
    const m = String(v).match(/^([A-Za-z\-]*?)(\d+)$/);
    if(m) best = m;
  }
  if(!best){
    return fallbackPrefix + String(1).padStart(pad,'0');
  }
  const prefix = best[1];
  const digits = best[2];
  const nextNum = String(parseInt(digits,10)+1).padStart(digits.length,'0');
  return prefix + nextNum;
}
function nextApiId(){ return nextSeqId(DB.apis, 'ID API', 'D', 4); }
function nextOpId(){ return nextSeqId(DB.ops, 'ID Operación', 'OP-', 4); }
function nextHistId(){ return nextSeqId(DB.hist, 'ID Historial', 'HIST-', 4); }

/* --- Registrar Componente: el catálogo ya no es solo APIs. Cada tipo tiene su propio
   prefijo de ID para que sea reconocible al usarse como dependencia de otro componente. --- */
const COMPONENT_PREFIX = {'API':'D', 'Microservicio':'MS', 'Tópico / Evento':'EVT', 'Batch / Job':'BATCH', 'Sistema Legado / Otro':'CMP'};
function tipoComponenteOf(a){ return (a && a['Tipo de Componente']) || 'API'; }
function nextComponentId(tipo){
  const prefix = COMPONENT_PREFIX[tipo] || 'CMP';
  let maxNum = 0;
  DB.apis.forEach(row=>{
    const v = row['ID API'];
    if(!v) return;
    const m = String(v).match(new RegExp('^'+prefix+'(\\d+)$'));
    if(m){ const n = parseInt(m[1],10); if(n>maxNum) maxNum = n; }
  });
  return prefix + String(maxNum+1).padStart(4,'0');
}

function sheetToObjects(wb, sheetName, headers){
  const ws = wb.Sheets[sheetName];
  if(!ws) return [];
  const rows = XLSX.utils.sheet_to_json(ws, {defval:'', raw:false});
  return rows
    .filter(r => headers.some(h => String(r[h]||'').trim() !== ''))
    .map(r => { const o={}; headers.forEach(h=>o[h]=r[h]!==undefined?r[h]:''); return o; });
}

/* --- Carga de un workbook (compartida por: input de archivo, y File System Access) --- */
function loadWorkbookFromArrayBuffer(arrayBuf, fileName){
  const wb = XLSX.read(new Uint8Array(arrayBuf), {type:'array', cellDates:true});
  const newDB = { apis:[], ops:[], hist:[], deps:[], listas: JSON.parse(JSON.stringify(DEFAULT_LISTS)) };
  newDB.apis = sheetToObjects(wb, SHEETS.apis, HEADERS.apis);
  newDB.ops = sheetToObjects(wb, SHEETS.ops, HEADERS.ops);
  newDB.hist = sheetToObjects(wb, SHEETS.hist, HEADERS.hist);
  newDB.deps = sheetToObjects(wb, SHEETS.deps, HEADERS.deps);
  newDB.apis.forEach(r=>{ r['Fecha de Registro']=fmtDate(r['Fecha de Registro']); });
  ['Fecha Registro','Fecha Fin Diseño','Fecha Pase Desarrollo','Fecha Pase QA','Fecha Pase Producción','Fecha_Última_Modificación'].forEach(f=>{
    newDB.hist.forEach(r=>{ if(r[f] && r[f]!=='TBD') r[f]=fmtDate(r[f]); });
  });
  if(wb.Sheets[SHEETS.listas]){
    const lws = wb.Sheets[SHEETS.listas];
    const raw = XLSX.utils.sheet_to_json(lws, {header:1, defval:''});
    const head = raw[0]||[];
    HEADERS.listas.forEach((col)=>{
      const idx = head.indexOf(col);
      if(idx>=0){
        const vals = raw.slice(1).map(row=>String(row[idx]||'').trim()).filter(Boolean);
        if(vals.length) newDB.listas[col] = Array.from(new Set(vals));
      }
    });
  }
  DB = newDB;
  META.fileName = fileName;
  META.lastImport = new Date().toISOString();
  return newDB;
}

function importExcel(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      loadWorkbookFromArrayBuffer(e.target.result, file.name);
      toast(`Archivo importado: ${DB.apis.length} APIs, ${DB.ops.length} operaciones, ${DB.hist.length} registros de histórico, ${DB.deps.length} dependencias.`,'ok');
      scheduleSave();
      TAB='dashboard';
      renderApp();
    }catch(err){
      console.error(err);
      toast('No se pudo leer el archivo. Verifica que sea el Excel de inventario (mismas hojas/columnas).','bad');
    }
  };
  reader.readAsArrayBuffer(file);
}

/* --- Construcción del workbook (compartida por: descarga manual, y guardado directo) --- */
function buildWorkbook(){
  const wb = XLSX.utils.book_new();
  const addSheet = (name, headers, rows) => {
    const aoa = [headers, ...rows.map(r => headers.map(h => r[h]!==undefined? r[h] : ''))];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = headers.map(h => ({wch: Math.min(38, Math.max(12, h.length+2))}));
    XLSX.utils.book_append_sheet(wb, ws, name);
  };
  addSheet(SHEETS.apis, HEADERS.apis, DB.apis);
  addSheet(SHEETS.ops, HEADERS.ops, DB.ops);
  const histRows = DB.hist.map(r=>({...r}));
  addSheet(SHEETS.hist, HEADERS.hist, histRows);
  const histWs = wb.Sheets[SHEETS.hist];
  const qCol = HEADERS.hist.indexOf('Quarter Publicación');
  const pCol = HEADERS.hist.indexOf('Fecha Pase Producción');
  histRows.forEach((r,i)=>{
    const rowNum = i+2;
    const pAddr = XLSX.utils.encode_cell({r:rowNum-1,c:pCol});
    const qAddr = XLSX.utils.encode_cell({r:rowNum-1,c:qCol});
    histWs[qAddr] = {t:'str', f:`IF(${pAddr}="","","Q"&ROUNDUP(MONTH(${pAddr})/3,0)&"-"&YEAR(${pAddr}))`, v:r['Quarter Publicación']||''};
  });
  addSheet(SHEETS.deps, HEADERS.deps, DB.deps);
  const listaAoa = [HEADERS.listas];
  const maxLen = Math.max(...HEADERS.listas.map(h=>getList(h).length));
  for(let i=0;i<maxLen;i++){
    listaAoa.push(HEADERS.listas.map(h => getList(h)[i] || ''));
  }
  const lws = XLSX.utils.aoa_to_sheet(listaAoa);
  XLSX.utils.book_append_sheet(wb, lws, SHEETS.listas);
  return wb;
}

function exportExcel(){
  const wb = buildWorkbook();
  const fname = META.fileName || `Inventario_Centralizado_APIs_${new Date().toISOString().slice(0,10)}.xlsx`;
  XLSX.writeFile(wb, fname);
  toast('Excel exportado. Súbelo al repositorio maestro para reemplazar la versión anterior.','ok');
}

/* --- Edición directa sobre archivo local conectado (Chrome/Edge) --- */
async function connectLocalFile(){
  if(!FS_ACCESS_SUPPORTED){
    toast('Tu navegador no soporta edición directa de archivos. Usa Chrome o Edge, o sigue usando Importar/Exportar.','bad');
    return;
  }
  try{
    const [handle] = await window.showOpenFilePicker({
      types:[{description:'Excel', accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']}}],
      excludeAcceptAllOption:false, multiple:false
    });
    const perm = await handle.requestPermission({mode:'readwrite'});
    if(perm !== 'granted'){ toast('No se concedió permiso de escritura sobre el archivo.','bad'); return; }
    const file = await handle.getFile();
    const buf = await file.arrayBuffer();
    loadWorkbookFromArrayBuffer(buf, file.name);
    fileHandle = handle;
    FILE_SAVE_OK = true;
    toast(`Conectado a "${file.name}". Cada cambio se guardará automáticamente en este archivo.`,'ok');
    TAB='dashboard';
    renderApp();
  }catch(e){
    if(e && e.name!=='AbortError'){ console.error(e); toast('No se pudo abrir el archivo local.','bad'); }
  }
}
function disconnectLocalFile(){
  fileHandle = null;
  FILE_SAVE_OK = null;
  toast('Archivo local desconectado. Vuelve a Importar/Exportar manualmente si lo necesitas.','info');
  renderApp();
}
async function writeToFileHandle(){
  if(!fileHandle) return;
  try{
    const wb = buildWorkbook();
    const buf = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    const writable = await fileHandle.createWritable();
    await writable.write(buf);
    await writable.close();
    FILE_SAVE_OK = true;
    META.lastFileSave = new Date().toISOString();
  }catch(e){
    FILE_SAVE_OK = false;
    console.error('No se pudo guardar en el archivo local', e);
    toast('No se pudo guardar en el archivo local — verifica permisos o que el archivo no esté abierto en Excel.','bad');
  }
}

function toast(msg, kind){
  const wrap = $('#toastWrap');
  const el = document.createElement('div');
  el.className = 'toast'+(kind?(' '+kind):'');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 4200);
}

function setTab(tab, mode){
  TAB = tab;
  if(mode) CONSULTA_MODE = mode;
  renderApp();
  window.scrollTo(0,0);
}

function renderSidebarSync(){
  const el = $('#syncLine');
  if(!el) return;
  let lines = [];
  lines.push(STORAGE_OK
    ? `<span class="dot on"></span> Borrador guardado ${META.lastSaved? '· '+new Date(META.lastSaved).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'}) : ''}`
    : `<span class="dot"></span> Sin conexión al borrador`);
  if(fileHandle){
    lines.push(FILE_SAVE_OK
      ? `<span class="dot on"></span> Archivo local: guardado ${META.lastFileSave? '· '+new Date(META.lastFileSave).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'}) : ''}`
      : `<span class="dot"></span> Error guardando en archivo local`);
  }
  el.innerHTML = lines.map(l=>`<div>${l}</div>`).join('');
}

function renderSidebar(){
  const groups = MENU.map(g => `
    <div class="tab-group-label">${esc(g.group)}</div>
    ${g.items.map(it => {
      const active = TAB===it.tab && (!it.mode || CONSULTA_MODE===it.mode);
      return `<button class="tab-btn ${active?'active':''}"
        onclick="setTab('${it.tab}'${it.mode?`,'${it.mode}'`:''})">
        <span class="num">${it.n}</span><span>${esc(it.label)}</span>
      </button>`;
    }).join('')}

  return `
  <aside class="sidebar">

      <div class="mark">Gobierno de APIs · MVP</div>
      <h1>Inventario Centralizado</h1>

      <div class="pill-role" style="margin-top:8px;">Perfil: Torre de Control — acceso completo</div>

    <nav class="tabs">${groups}</nav>

      <div class="sync-line" id="syncLine"></div>

  </aside>`;
}

function githubSyncControls(){
  if(GITHUB_SYNCING){
    return `<span class="pill-role" style="border-color:var(--info);color:var(--info);">⏳ Guardando en GitHub…</span>`;
  }
  const pending = PENDING_BATCH.length;
  const sendBtn = pending
    ? `<button class="btn primary" onclick="enviarATorreControl()">📨 Enviar a Torre de Control <span class="badge warn" style="margin-left:6px;">${pending}</span></button>`
    : `<span class="pill-role" title="Todo lo que registraste ya está guardado en el Excel oficial de GitHub">✓ Sin cambios pendientes de enviar</span>`;
  const refreshBtn = githubConfigured()
    ? `<button class="btn ghost" title="Trae la versión más reciente del Excel oficial desde GitHub" onclick="actualizarDesdeGitHub()">↻ Actualizar desde GitHub</button>`
    : '';
  return `${sendBtn}${refreshBtn}`;
}
function topbar(title, sub){
  const fileActions = fileHandle ? `
      <span class="pill-role" style="border-color:var(--ok);color:var(--ok);">🔗 ${esc(META.fileName||'archivo conectado')}</span>

      <button class="btn ghost" onclick="exportExcel()">Descargar copia</button>

      </label>
      ${FS_ACCESS_SUPPORTED ? `<button class="btn primary" onclick="connectLocalFile()">Editar archivo local (auto-guardado)</button>` : ''}
      <button class="btn ghost" onclick="exportExcel()">Exportar Excel</button>

  return `
  <div class="topbar">
    <div>
      <h2>${title}</h2>

    <div class="file-actions">

}

function renderApp(){
  const el = $('#app');
  el.innerHTML = renderSidebar() + `<main class="main" id="mainArea"></main>`;
  renderSidebarSync();
  const main = $('#mainArea');
  main.innerHTML = renderTab();
}
function reRenderKeepingFocus(inputId){
  // renderApp() reemplaza todo el DOM (innerHTML), lo que hace perder el foco de los inputs de texto.
  // Esta función vuelve a enfocar el input y coloca el cursor al final tras el re-render.
  renderApp();
  const el = document.getElementById(inputId);
  if(el){
    el.focus();
    const pos = el.value.length;
    try{ el.setSelectionRange(pos,pos); }catch(e){}
  }
}

function renderTab(){
  switch(TAB){
    case 'dashboard': return viewDashboard();
    case 'buscar': return viewBuscar();
    case 'crear': return viewCrear();
    case 'modificar': return viewModificar();
    case 'reutilizar': return viewReutilizar();
    case 'operaciones': return viewOperaciones();
    case 'dependencias': return viewDependencias();
    case 'historial': return viewHistorial();
    case 'estado': return viewEstado();
    case 'cruce': return viewCruce();
    case 'torre': return viewTorreControl();
    case 'consultas': return viewConsultas();
    case 'listas': return viewListas();
    case 'guia': return viewGuia();
    default: return viewDashboard();
  }
}

/* ---------------------------------------------------------------- BUSCAR API */
let buscarState = {q:'', pais:'', tipo:'', estados:[], dominio:'', arquitecto:'', proyecto:'', quarters:[], anios:[], acciones:[], page:1, pageSize:20};
function architectsForApi(id){ return Array.from(new Set(histForApi(id).map(h=>h['Arquitecto Solución']).filter(Boolean))); }
function projectsForApi(id){ return Array.from(new Set(histForApi(id).map(h=>h['Proyecto']).filter(Boolean))); }
function accionesForApi(id){ return Array.from(new Set(histForApi(id).map(h=>h['Acción']).filter(Boolean))); }
function countApisBy(field){
  const map = {};
  DB.apis.forEach(a=>{
    const vals = Array.from(new Set(histForApi(a['ID API']).map(h=>h[field]).filter(Boolean)));
    vals.forEach(v=>{ map[v] = (map[v]||0)+1; });
  });
  return Object.entries(map).sort((x,y)=>y[1]-x[1]);
}
function apiQuarterInfo(id){
  // Toma el registro de histórico con el Quarter Publicación más avanzado (próximo cierre/pase a producción) — solo para mostrar en la tabla
  let best = null;
  histForApi(id).forEach(h=>{
    if(!h['Quarter Publicación']) return;
    if(!best || quarterSortKey(h['Quarter Publicación']) > quarterSortKey(best['Quarter Publicación'])) best = h;
  });
  return best ? {quarter:best['Quarter Publicación'], fecha:best['Fecha Pase Producción']} : {quarter:'', fecha:''};
}
function quarterNumberOf(quarterLabel){
  // Solo acepta el formato exacto "Q3-2026" (Q + dígito 1-4 + guion + año de 4 dígitos)
  const m = /^Q([1-4])-\d{4}$/.exec(String(quarterLabel||'').trim());
  return m ? parseInt(m[1],10) : null;
}
function yearOf(quarterLabel){
  const m = /^Q[1-4]-(\d{4})$/.exec(String(quarterLabel||'').trim());
  return m ? parseInt(m[1],10) : null;
}
function apiQuarterNumbers(id){
  // Lee directamente la columna Quarter Publicación de Histórico_Proyectos_API para esta API (formato exacto Q#-AAAA)
  return new Set(histForApi(id).map(h=>quarterNumberOf(h['Quarter Publicación'])).filter(Boolean));
}
function toggleEstadoFilter(v){
  const i = buscarState.estados.indexOf(v);
  if(i>=0) buscarState.estados.splice(i,1); else buscarState.estados.push(v);
  buscarState.page = 1;
  renderApp();
}
function toggleQuarterFilter(qn){
  const i = buscarState.quarters.indexOf(qn);
  if(i>=0) buscarState.quarters.splice(i,1); else buscarState.quarters.push(qn);
  buscarState.page = 1;
  renderApp();
}
function toggleAnioFilter(yr){
  const i = buscarState.anios.indexOf(yr);
  if(i>=0) buscarState.anios.splice(i,1); else buscarState.anios.push(yr);
  buscarState.page = 1;

}
function toggleAccionFilter(acc){
  const i = buscarState.acciones.indexOf(acc);
  if(i>=0) buscarState.acciones.splice(i,1); else buscarState.acciones.push(acc);
  buscarState.page = 1;
  renderApp();
}
function viewBuscar(){
  let apis = DB.apis.slice();
  const s = buscarState;
  if(s.q){
    const q = s.q.toLowerCase();
    apis = apis.filter(a => [a['ID API'],a['Nombre API'],a['Descripción'],a['Business Domain'],a['Service Domain'],a['Business Area']]
      .some(v => String(v||'').toLowerCase().includes(q)));
  }
  if(s.pais) apis = apis.filter(a=>a['País']===s.pais);
  if(s.tipo) apis = apis.filter(a=>String(a['Tipo API']||'').trim()===s.tipo);
  if(s.estados.length) apis = apis.filter(a=>s.estados.includes(a['Estado_General_API']));
  if(s.dominio) apis = apis.filter(a=>a['Business Domain']===s.dominio);

  // Arquitecto, Proyecto, Acción, Quarter y Año deben cumplirse en UN MISMO registro de histórico
  // (p.ej. "Q3-2026 + Creación" = el evento de creación ocurrió exactamente en ese quarter/año)
  const histFiltersActive = !!(s.arquitecto || s.proyecto || s.acciones.length || s.quarters.length || s.anios.length);
  function rowMatches(h){
    if(s.arquitecto && String(h['Arquitecto Solución']||'').trim()!==s.arquitecto) return false;
    if(s.proyecto && String(h['Proyecto']||'').trim()!==s.proyecto) return false;
    if(s.acciones.length){
      const acc = String(h['Acción']||'').trim();
      if(!s.acciones.some(x=>x.toLowerCase()===acc.toLowerCase())) return false;
    }
    if(s.quarters.length){
      const qn = quarterNumberOf(h['Quarter Publicación']);
      if(!qn || !s.quarters.includes(qn)) return false;
    }
    if(s.anios.length){
      const yr = yearOf(h['Quarter Publicación']);
      if(!yr || !s.anios.includes(yr)) return false;
    }
    return true;
  }

  // Cuando hay filtros de histórico activos, cada fila de histórico que coincide genera su propia
  // entrada en la tabla (una API con 2 proyectos que coinciden aparece 2 veces, una por proyecto).
  let entries = [];
  apis.forEach(a=>{
    if(histFiltersActive){
      histForApi(a['ID API']).filter(rowMatches).forEach(h=>entries.push({api:a, hist:h}));
    } else {
      entries.push({api:a, hist:null});
    }
  });

  // Cuenta cuántas veces aparece cada API en el resultado actual — si un ID se repite es porque tiene
  // más de un registro de histórico que coincide con los filtros (p.ej. 2 filas de "Creación" para la
  // misma API), no porque el filtro esté fallando. Se muestra para que sea visible, no se oculta.
  const apiOccurrences = {};
  entries.forEach(e=>{ const id=e.api['ID API']; apiOccurrences[id]=(apiOccurrences[id]||0)+1; });

  // Ordena por fecha de pase a producción más próxima primero cuando hay un filtro de quarter/año activo
  if(s.quarters.length || s.anios.length){
    entries = entries.slice().sort((x,y)=> String((x.hist&&x.hist['Fecha Pase Producción'])||'').localeCompare(String((y.hist&&y.hist['Fecha Pase Producción'])||'')));
  }

  const totalEncontradas = entries.length;
  const pageSize = s.pageSize || 20;
  const totalPages = Math.max(1, Math.ceil(totalEncontradas / pageSize));
  if(s.page > totalPages) s.page = totalPages;
  if(s.page < 1) s.page = 1;
  const startIdx = (s.page - 1) * pageSize;
  const pageEntries = entries.slice(startIdx, startIdx + pageSize);

  const dominios = uniqueVals(DB.apis,'Business Domain');
  const arquitectos = uniqueVals(DB.hist,'Arquitecto Solución');
  const proyectos = uniqueVals(DB.hist,'Proyecto');
  const anios = Array.from(new Set(DB.hist.map(h=>yearOf(h['Quarter Publicación'])).filter(Boolean))).sort();
  const porArquitecto = countApisBy('Arquitecto Solución').slice(0,8);
  const porProyecto = countApisBy('Proyecto').slice(0,8);
  const maxArq = Math.max(1,...porArquitecto.map(x=>x[1]));
  const maxProy = Math.max(1,...porProyecto.map(x=>x[1]));

  const porQuarterNum = {1:0,2:0,3:0,4:0};
  DB.apis.forEach(a=>{ apiQuarterNumbers(a['ID API']).forEach(qn=>{ porQuarterNum[qn]++; }); });
  const maxQ = Math.max(1,...Object.values(porQuarterNum));

  return `
    ${topbar('Buscar API', 'Antes de registrar un componente nuevo (API, microservicio, tópico o batch), verifica siempre si ya existe uno equivalente o reutilizable en el catálogo.')}

    <div class="two-col">
      <div class="card">
        <h3>APIs por Arquitecto de Solución</h3>
        <div class="hint">Cuántas APIs distintas ha creado, modificado o reutilizado cada arquitecto. Clic para filtrar.</div>
        <div class="barlist">
          ${porArquitecto.map(([k,v])=>`
            <div class="barrow" style="cursor:pointer;" onclick="buscarState.arquitecto='${esc(k)}'; buscarState.page=1; renderApp();">
              <div class="lbl" title="${esc(k)}">${esc(k)}</div>
              <div class="track"><div class="fill" style="width:${(v/maxArq*100).toFixed(0)}%"></div></div>
              <div class="val">${v}</div>
            </div>`).join('') || '<div class="empty-state">Sin datos aún</div>'}
        </div>
      </div>
      <div class="card">
        <h3>APIs por Proyecto</h3>
        <div class="hint">Cuántas APIs distintas ha tocado cada proyecto (creación, modificación o reutilización). Clic para filtrar.</div>
        <div class="barlist">
          ${porProyecto.map(([k,v])=>`
            <div class="barrow" style="cursor:pointer;" onclick="buscarState.proyecto='${esc(k)}'; buscarState.page=1; renderApp();">
              <div class="lbl" title="${esc(k)}">${esc(k)}</div>
              <div class="track"><div class="fill" style="width:${(v/maxProy*100).toFixed(0)}%"></div></div>
              <div class="val">${v}</div>
            </div>`).join('') || '<div class="empty-state">Sin datos aún</div>'}
        </div>
      </div>
    </div>

    <div class="card">
      <h3>APIs por Quarter de pase a producción</h3>
      <div class="hint">Con cuántas APIs se relaciona cada quarter (Q1–Q4), leído directamente de la columna <b>Quarter Publicación</b> de Histórico_Proyectos_API (todos los años). Clic para (des)marcar — puedes seleccionar varios a la vez. Combina con Año para acotar a un Quarter-Año exacto como "Q3-2026".</div>
      <div class="barlist">
        ${[1,2,3,4].map(qn=>{
          const v = porQuarterNum[qn]||0;
          const active = s.quarters.includes(qn);
          return `<div class="barrow" style="cursor:pointer;" onclick="toggleQuarterFilter(${qn})">
              <div class="lbl">Q${qn}${active?' <span class="badge gold" style="background:var(--gold);color:#fff;margin-left:4px;">seleccionado</span>':''}</div>
              <div class="track"><div class="fill" style="width:${(v/maxQ*100).toFixed(0)}%;${active?'background:var(--gold-dark);':''}"></div></div>
              <div class="val">${v}</div>
            </div>`;
        }).join('')}
      </div>
    </div>

    <div class="card">
      <div class="search-row">
        <input type="search" id="buscarSearchInput" style="flex:1 1 100%;" placeholder="Buscar por ID, nombre, descripción, dominio o service domain…" value="${esc(s.q)}" oninput="buscarState.q=this.value; buscarState.page=1; reRenderKeepingFocus('buscarSearchInput');">
      </div>

      <div class="section-title" style="margin:14px 0 8px;">Filtros del catálogo</div>
      <div class="search-row">
        <select onchange="buscarState.pais=this.value; buscarState.page=1; renderApp();">
          <option value="">País (todos)</option>
          ${getList('Pais').map(p=>`<option ${s.pais===p?'selected':''}>${esc(p)}</option>`).join('')}
        </select>
        <select onchange="buscarState.tipo=this.value; buscarState.page=1; renderApp();">
          <option value="">Tipo BIAN (todos)</option>

function pushDepRowsFor(consumidorId, consumidorNombre, rowsArr){
  let n = 0;
  rowsArr.forEach(r=>{
    let pId='', pNombre='';
    if(r.tipoArtefacto==='Componente del Catálogo'){
      if(!r.consumidaId) return;
      pId = r.consumidaId;
      const pApi = findApi(pId);
      pNombre = pApi?pApi['Nombre API']:'';
    } else {
      if(!String(r.consumidaNombre||'').trim()) return;
      pNombre = r.consumidaNombre.trim();
    }
    DB.deps.push({
      'ID_API_Consumidor':consumidorId, 'Nombre_API_Consumidor':consumidorNombre,
      'Tipo_Artefacto_Consumido':r.tipoArtefacto,
      'ID_API_Consumida':pId, 'Nombre_API_Consumida':pNombre,
      'Tipo_Dependencia':r.tipoDep, 'Criticidad':r.criticidad, 'Comentarios':(r.comentarios||'').trim()
    });
    n++;
  });
  return n;
}

function checkDuplicidad(term, targetId){
  const box = document.getElementById(targetId);
  if(!box) return;
  if(!term || term.trim().length<3){ box.innerHTML=''; return; }
  const t = term.toLowerCase();
  const matches = DB.apis.filter(a => (a['Nombre API']||'').toLowerCase().includes(t) || (a['Business Domain']||'').toLowerCase().includes(t) || (a['Service Domain']||'').toLowerCase().includes(t)).slice(0,6);
  if(!matches.length){ box.innerHTML = `<div class="alert ok" style="margin-top:10px;"><span>✓</span><div>No se encontraron APIs similares por nombre o dominio. Puedes continuar con la creación.</div></div>`; return; }
  box.innerHTML = `<div class="alert warn" style="margin-top:10px;"><span>⚠</span><div><b>Posible reutilización disponible — revisa antes de continuar:</b><ul>
    ${matches.map(m=>`<li><code class="idtag">${esc(m['ID API'])}</code> ${esc(m['Nombre API'])} — ${esc(m['Business Domain'])} / ${esc(m['Service Domain'])} ${badgeForEstadoApi(m['Estado_General_API'])}</li>`).join('')}
  </ul>Si alguna cumple la necesidad, usa <b>Reutilizar API</b> o <b>Modificar API</b> en vez de crear una nueva.</div></div>`;
}

function submitCrear(ev){
  ev.preventDefault();
  const id = $('#c_id').value.trim();
  if(!id){ toast('El ID es obligatorio','bad'); return false; }
  if(findApi(id)){ toast('Ya existe un componente con ese ID. Usa Modificar o Reutilizar en su lugar.','bad'); return false; }
  const tipoComponente = $('#c_tipo_componente').value;
  const validOps = crearOps.filter(r=>r.path.trim()!=='');
  if(tipoComponente==='API' && !validOps.length){ toast('Agrega al menos una operación con su Path definido.','bad'); return false; }

  const apiRow = {};
  HEADERS.apis.forEach(h=>apiRow[h]='');
  apiRow['ID API']=id;
  apiRow['País']=$('#c_pais').value;
  apiRow['Nombre API']=$('#c_nombre').value.trim();
  apiRow['Descripción']=$('#c_desc').value.trim();
  apiRow['Tipo de Componente']=tipoComponente;
  apiRow['Tipo API']=(tipoComponente==='API') ? $('#c_tipo').value : '';
  apiRow['Business Area']=$('#c_area').value.trim();
  apiRow['Business Domain']=$('#c_domain').value.trim();
  apiRow['Service Domain']=$('#c_svc').value.trim();
  apiRow['Complejidad']=$('#c_complejidad').value;
  apiRow['Estilo Diseño']=$('#c_estilo').value;
  apiRow['Canal Integración (Despliegue)']=$('#c_canal').value;
  apiRow['URL OpenAPI (SWAGGER)']=$('#c_url').value.trim();
  apiRow['Versión Actual']=$('#c_version').value.trim()||'v1.0.0';
  apiRow['Fecha de Registro']=$('#c_fecha').value;
  apiRow['Estado_General_API']=$('#c_estado').value;
  apiRow['Service Owner']=$('#c_owner').value.trim();
  apiRow['Caso de Uso']=$('#c_casouso').value.trim();
  apiRow['Repositorios Involucrados']=$('#c_repos').value.trim();
  apiRow['Excepción / Riesgo Identificado']=$('#c_excepcion').value.trim();
  DB.apis.push(apiRow);

  const opIds = [];
  validOps.forEach(r=>{
    const opId = nextOpId();
    DB.ops.push({
      'ID Operación':opId, 'ID API':id, 'Método HTTP':r.metodo, 'Path - Endpoint':r.path.trim(),
      'Descripción Operación':r.desc.trim(), 'Versión Desde':r.version||'v1.0.0', 'Estado Operación':r.estado
    });
    opIds.push(opId);
  });

  const histRow = {};
  HEADERS.hist.forEach(h=>histRow[h]='');
  Object.assign(histRow, {
    'ID Historial': nextHistId(),
    'ID API': id,
    'Proyecto': $('#c_proyecto').value.trim(),
    'Tribu': $('#c_tribu').value.trim(),
    'Acción': 'Creación',
    'Operaciones (Creadas/Modificadas)': opIds.join(', '),
    'PO/Líder Usuario': $('#c_po').value.trim(),
    'TTL': $('#c_ttl').value.trim(),
    'Jefe Proyecto': $('#c_jp').value.trim(),
    'Líder Técnico': $('#c_lt').value.trim(),
    'Arquitecto Solución': $('#c_arq').value.trim(),
    'Consumidores': $('#c_consum').value.trim(),
    'Fecha Registro': $('#c_fecha').value,
    'Fecha Fin Diseño': $('#c_fdiseno').value.trim(),
    'Fecha Pase Desarrollo': $('#c_fdesarrollo').value.trim(),
    'Fecha Pase QA': $('#c_fqa').value.trim(),
    'Fecha Pase Producción': $('#c_fprod').value.trim(),
    'Quarter Publicación': computeQuarter($('#c_fprod').value.trim()),
    'Estado_Actual': $('#c_estadoact').value,
    'Versión_Antes': '',
    'Versión_Después': apiRow['Versión Actual'],
    'Breaking_Change': 'No',
    'Complejidad': apiRow['Complejidad'],
    'Justificación_Complejidad': $('#c_justcomp').value.trim(),
    'Última_Modificación_Por': $('#c_arq').value.trim(),
    'Fecha_Última_Modificación': new Date().toISOString().slice(0,10),
    'Motivo_Modificación': 'Publicación inicial',
    'Observaciones_Cruce': '',
    'Comentarios': $('#c_comentarios').value.trim(),
    'Estado de Validación': 'Registrado',
    'Observación Torre de Control': '',
    'Fecha Validación': ''
  });
  DB.hist.push(histRow);

  const nDeps = pushDepRowsFor(id, apiRow['Nombre API'], crearDeps);

  PENDING_BATCH.push({
    id, nombre: apiRow['Nombre API'], tipoComponente,
    accion: 'Creación', proyecto: histRow['Proyecto'], arquitecto: histRow['Arquitecto Solución'],
    fecha: histRow['Fecha Registro']
  });
  scheduleSave();
  toast(`${tipoComponente} ${id} registrado${opIds.length?` con ${opIds.length} operación(es)`:''}${nDeps?` y ${nDeps} dependencia(s)`:''}. Queda en tu lote local — presiona "Enviar a Torre de Control" cuando termines de cargar todos los componentes.`,'ok');
  setTab('buscar');
  openApiDetail(id);
  return false;
}

function apiSelectOptions(selected){
  return DB.apis.map(a=>{
    const nombre = (a['Nombre API']||'').trim();

function submitModificar(ev, id){
  ev.preventDefault();
  const a = findApi(id);
  const versionAntes = a['Versión Actual'];
  a['País']=$('#m_pais').value; a['Nombre API']=$('#m_nombre').value.trim(); a['Descripción']=$('#m_desc').value.trim();
  a['Tipo API']=$('#m_tipo').value; a['Complejidad']=$('#m_complejidad').value; a['Estilo Diseño']=$('#m_estilo').value;
  a['Business Area']=$('#m_area').value.trim(); a['Business Domain']=$('#m_domain').value.trim(); a['Service Domain']=$('#m_svc').value.trim();
  a['Canal Integración (Despliegue)']=$('#m_canal').value; a['Versión Actual']=$('#m_version').value.trim();
  a['URL OpenAPI (SWAGGER)']=$('#m_url').value.trim(); a['Estado_General_API']=$('#m_estado').value;
  a['Service Owner']=$('#m_owner').value.trim();
  a['Caso de Uso']=$('#m_casouso').value.trim();
  a['Repositorios Involucrados']=$('#m_repos').value.trim();
  a['Excepción / Riesgo Identificado']=$('#m_excepcion').value.trim();

  const opIds = [];
  modOps.forEach(r=>{
    if(!r['Path - Endpoint'] || !r['Path - Endpoint'].trim()) return;
    if(!r['ID Operación']){
      r['ID Operación'] = nextOpId();
      r['ID API'] = id;
      DB.ops.push({...r});
    } else {
      const existing = DB.ops.find(o=>o['ID Operación']===r['ID Operación']);
      if(existing) Object.assign(existing, r);
    }
    opIds.push(r['ID Operación']);
  });

  const histRow = {};
  HEADERS.hist.forEach(h=>histRow[h]='');
  Object.assign(histRow, {
    'ID Historial': nextHistId(), 'ID API': id, 'Proyecto': $('#m_proyecto').value.trim(), 'Tribu': $('#m_tribu').value.trim(), 'Acción': $('#m_accion').value,
    'Operaciones (Creadas/Modificadas)': opIds.join(', '),
    'PO/Líder Usuario': $('#m_po').value.trim(), 'TTL': $('#m_ttl').value.trim(), 'Jefe Proyecto': $('#m_jp').value.trim(), 'Líder Técnico': $('#m_lt').value.trim(),
    'Arquitecto Solución': $('#m_arq').value.trim(), 'Consumidores': $('#m_consum').value.trim(),
    'Fecha Registro': $('#m_fecha').value, 'Fecha Pase Producción': $('#m_fprod').value.trim(),
    'Quarter Publicación': computeQuarter($('#m_fprod').value.trim()),
    'Fecha Fin Diseño':'TBD','Fecha Pase Desarrollo':'TBD','Fecha Pase QA':'TBD',
    'Estado_Actual': $('#m_estadoact').value, 'Versión_Antes': versionAntes, 'Versión_Después': a['Versión Actual'],
    'Breaking_Change': $('#m_breaking').value, 'Complejidad': a['Complejidad'], 'Justificación_Complejidad': $('#m_justcomp').value.trim(),
    'Última_Modificación_Por': $('#m_arq').value.trim(), 'Fecha_Última_Modificación': new Date().toISOString().slice(0,10),
    'Motivo_Modificación': $('#m_motivo').value.trim(),
    'Observaciones_Cruce': '', 'Comentarios': $('#m_comentarios').value.trim(),
    'Estado de Validación': 'Registrado', 'Observación Torre de Control': '', 'Fecha Validación': ''
  });
  DB.hist.push(histRow);

  const nDeps = pushDepRowsFor(id, a['Nombre API'], modDeps);

  PENDING_BATCH.push({
    id, nombre: a['Nombre API'], tipoComponente: tipoComponenteOf(a),
    accion: histRow['Acción'], proyecto: histRow['Proyecto'], arquitecto: histRow['Arquitecto Solución'],
    fecha: histRow['Fecha Registro']
  });
  scheduleSave();
  toast(`API ${id} actualizada (v${versionAntes} → v${a['Versión Actual']})${nDeps?` con ${nDeps} dependencia(s) nueva(s)`:''}. Queda en tu lote local — presiona "Enviar a Torre de Control" cuando termines.`,'ok');
  modificarId = null;
  setTab('buscar');
  openApiDetail(id);
  return false;
}

function submitEstado(ev, histId){
  ev.preventDefault();
  const row = DB.hist.find(h=>h['ID Historial']===histId);
  const api = findApi(row['ID API']);
  if(api && $('#e_estado_general')){
    api['Estado_General_API'] = $('#e_estado_general').value;
    api['Versión Actual'] = $('#e_version').value.trim();
    api['Nombre API'] = $('#e_nombre').value.trim();
    api['Descripción'] = $('#e_desc').value.trim();
    if($('#e_tipoapi')) api['Tipo API'] = $('#e_tipoapi').value;
    api['Complejidad'] = $('#e_complejidad').value;
    api['Estilo Diseño'] = $('#e_estilo').value;
    api['Business Area'] = $('#e_area').value.trim();
    api['Business Domain'] = $('#e_domain').value.trim();
    api['Service Domain'] = $('#e_svc').value.trim();
    api['Canal Integración (Despliegue)'] = $('#e_canal').value;
    api['URL OpenAPI (SWAGGER)'] = $('#e_url').value.trim();
    api['Service Owner'] = $('#e_owner').value.trim();
    api['Caso de Uso'] = $('#e_casouso').value.trim();
    api['Repositorios Involucrados'] = $('#e_repos').value.trim();
    api['Excepción / Riesgo Identificado'] = $('#e_excepcion').value.trim();
    modOps.forEach(r=>{
      if(!r['Path - Endpoint'] || !r['Path - Endpoint'].trim()) return;
      if(!r['ID Operación']){
        r['ID Operación'] = nextOpId();
        r['ID API'] = row['ID API'];
        DB.ops.push({...r});
      } else {
        const existing = DB.ops.find(o=>o['ID Operación']===r['ID Operación']);
        if(existing) Object.assign(existing, r);
      }
    });
  }
  row['Tribu']=$('#e_tribu').value.trim();
  row['PO/Líder Usuario']=$('#e_po').value.trim();
  row['TTL']=$('#e_ttl').value.trim();
  row['Jefe Proyecto']=$('#e_jp').value.trim();
  row['Líder Técnico']=$('#e_lt').value.trim();
  row['Estado_Actual']=$('#e_estado').value;
  row['Fecha Fin Diseño']=$('#e_fdiseno').value.trim();
  row['Fecha Pase Desarrollo']=$('#e_fdesarrollo').value.trim();
  row['Fecha Pase QA']=$('#e_fqa').value.trim();
  row['Fecha Pase Producción']=$('#e_fprod').value.trim();
  row['Quarter Publicación']=computeQuarter(row['Fecha Pase Producción']);
  row['Comentarios']=$('#e_comentarios').value.trim();
  row['Etapa Planificación']=$('#e_etplan').value;
  row['Fecha Fin Planificación']=$('#e_fplan').value.trim();
  row['Etapa Diseño']=$('#e_etdis').value;
  row['Etapa Desarrollo']=$('#e_etdev').value;
  row['Etapa Calidad']=$('#e_etqa').value;
  row['Etapa Producción']=$('#e_etprod').value;
  row['Fecha_Última_Modificación']=new Date().toISOString().slice(0,10);
  scheduleSave();
  toast('Estado y fechas actualizados.','ok');
  renderApp();
  return false;
}

/* ---------------------------------------------------------------- TORRE DE CONTROL (validación) */
/*
  Refleja el flujo socializado con los equipos:
  Arquitecto de Solución: 0) Revisa el inventario (Buscar API) -> 1) Inscribe en el backlog (Crear/Modificar/Reutilizar,
  quedan en Histórico_Proyectos_API) -> 2) Aviso automático a la Torre (toast al guardar).
  Torre de Control: contraste y validación contra el estándar de gobierno (naming, duplicidad, owner, clasificación).
    - Observado -> se notifica; el Arquitecto corrige la MISMA fila (no crea una nueva) -> pasa a Corregido -> vuelve a validarse.
    - Correcto -> Publicado: el registro queda oficial en el inventario (fuente única de verdad).
*/
let torreState = {chip:'pendientes', q:''};
function viewTorreControl(){
  const s = torreState;
  let rows = DB.hist.slice();
  if(s.chip==='pendientes') rows = rows.filter(h=>['Registrado','Corregido'].includes(h['Estado de Validación']));
  else if(s.chip==='observados') rows = rows.filter(h=>h['Estado de Validación']==='Observado');
  else if(s.chip==='publicados') rows = rows.filter(h=>h['Estado de Validación']==='Publicado');
  // 'todos' no filtra

  if(s.q){
    const q = s.q.toLowerCase();
    rows = rows.filter(h=>{
      const a = findApi(h['ID API']);
      return [h['ID API'], h['Proyecto'], h['Arquitecto Solución'], a?a['Nombre API']:'']
        .some(v=>String(v||'').toLowerCase().includes(q));
    });
  }
  rows = rows.slice().sort((a,b)=> String(a['Fecha Registro']||'').localeCompare(String(b['Fecha Registro']||'')));

  const pendientes = pendientesValidacion().length;
  const chips = [
    {k:'pendientes', l:`Pendientes de validar (${pendientes})`},
    {k:'observados', l:'Observados (por corregir)'},
    {k:'publicados', l:'Publicados'},
    {k:'todos', l:'Todos'},
  ];

  return `
    ${topbar('Torre de Control · Validar Solicitudes', 'Contraste y validación de lo inscrito en el backlog contra el estándar de gobierno: naming, duplicidad, owner de negocio y clasificación correcta.')}
    ${pendientes ? `<div class="alert warn"><span>★</span><div><b>${pendientes} solicitud(es)</b> esperan contraste y validación de la Torre de Control.</div></div>` : `<div class="alert ok"><span>✓</span><div>No hay solicitudes pendientes de validar.</div></div>`}

    <div class="card">
      <div class="search-row">
        <input type="search" id="torreSearchInput" style="flex:1;" placeholder="Buscar por ID API, nombre, proyecto o arquitecto…" value="${esc(s.q)}" oninput="torreState.q=this.value; reRenderKeepingFocus('torreSearchInput');">
      </div>
      <div class="chips" style="margin-bottom:14px;">
        ${chips.map(ch=>`<div class="chip ${s.chip===ch.k?'active':''}" onclick="torreState.chip='${ch.k}'; renderApp();">${esc(ch.l)}</div>`).join('')}
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>Componente</th><th>Nombre</th><th>Proyecto</th><th>Acción</th><th>Arquitecto</th><th>Fecha registro</th><th>Estado de Validación</th><th>Observación</th><th></th></tr></thead>
        <tbody>
          ${rows.map(h=>{
            const a = findApi(h['ID API']);
            const enCurso = ['Registrado','Corregido'].includes(h['Estado de Validación']);
            const esNueva = h['Estado de Validación']==='Registrado' && fmtDate(h['Fecha Registro'])===fmtDate(new Date().toISOString());
            return `<tr>
              <td><code class="idtag">${esc(h['ID API'])}</code><br>${badgeForTipoComponente(a?a['Tipo de Componente']:'')}${esNueva?' <span class="badge warn">nuevo</span>':''}</td>
              <td class="wrap">${a?esc(a['Nombre API']):'<i>(no está en Catálogo)</i>'}</td>
              <td class="wrap">${esc(h['Proyecto'])}</td>
              <td>${badgeForAccion(h['Acción'])}</td>
              <td class="wrap">${esc(h['Arquitecto Solución'])}</td>
              <td>${esc(fmtDate(h['Fecha Registro']))}</td>
              <td>${badgeForEstadoValidacion(h['Estado de Validación'])}</td>
              <td class="wrap">${esc(h['Observación Torre de Control'])||'—'}</td>
              <td style="white-space:nowrap;">
                <button class="rowbtn" style="margin-right:8px;" onclick="openApiDetail('${esc(h['ID API'])}')">Ver ficha ›</button>
                ${enCurso ? `
                  <button class="btn small gold" onclick="marcarPublicado('${esc(h['ID Historial'])}')">✓ Publicar</button>
                  <button class="btn small danger" onclick="abrirObservarModal('${esc(h['ID Historial'])}')">⚠ Observar</button>
                ` : ''}
              </td>
            </tr>`;

/* ---------------------------------------------------------------- CRUCE APIs x PROYECTOS */
let cruceState = {group:'Business Domain', q:''};
const CRUCE_GROUP_COLORS = ['#2B5F8A','#B8862E','#2F7A56','#7A4FA0','#B0392F','#3D5568'];
function quarterSortKey(q){
  const m = /^Q(\d)-(\d{4})$/.exec(q||'');
  if(!m) return 999999;
  return parseInt(m[2],10)*10 + parseInt(m[1],10);
}
function viewCruce(){
  const proyectos = uniqueVals(DB.hist,'Proyecto');
  const proyectoInfo = {};
  DB.hist.forEach(h=>{
    if(!h['Proyecto']) return;
    const info = proyectoInfo[h['Proyecto']] || {fecha:'', lider:'', tribu:'', quarter:''};
    // Responsable (TTL o JP) y Tribu: se toma del registro más reciente que traiga el dato
    if(String(h['Fecha Registro']||'') >= String(info.fecha||'')){
      info.fecha = h['Fecha Registro']||info.fecha;
      if(h['TTL'] || h['Jefe Proyecto']) info.lider = h['TTL'] || h['Jefe Proyecto'];
      if(h['Tribu']) info.tribu = h['Tribu'];
    }
    // Quarter comprometido: se toma el más avanzado (último) registrado para el proyecto
    if(h['Quarter Publicación'] && quarterSortKey(h['Quarter Publicación']) > quarterSortKey(info.quarter)){
      info.quarter = h['Quarter Publicación'];
    }
    proyectoInfo[h['Proyecto']] = info;
  });

  const groupField = cruceState.group;
  let apis = DB.apis.slice();
  if(cruceState.q){
    const q = cruceState.q.toLowerCase();
    apis = apis.filter(a => [a['Nombre API'],a['Service Domain'],a['Business Domain']].some(v=>String(v||'').toLowerCase().includes(q)));
  }
  const groups = {};
  apis.forEach(a=>{
    const raw = groupField==='Tipo API' ? String(a[groupField]||'').trim() : a[groupField];
    const k = raw || 'Sin categoría';
    (groups[k]=groups[k]||[]).push(a);
  });
  const groupEntries = Object.entries(groups).sort((x,y)=>y[1].length-x[1].length);

  const cellMap = {};
  DB.hist.forEach(h=>{
    if(!h['ID API']||!h['Proyecto']) return;
    const key = h['ID API']+'|'+h['Proyecto'];
    const cur = cellMap[key];
    if(!cur || String(h['Fecha Registro']||'') >= String(cur['Fecha Registro']||'')) cellMap[key]=h;
  });

  // Ordena proyectos por quarter comprometido (cronológico) y arma los grupos de columnas
  const proyectosOrdenados = proyectos.slice().sort((a,b)=>
    quarterSortKey(proyectoInfo[a].quarter) - quarterSortKey(proyectoInfo[b].quarter) || a.localeCompare(b));
  const quarterGroups = [];
  proyectosOrdenados.forEach(p=>{
    const label = proyectoInfo[p].quarter ? `CON COMPROMISO EN ${proyectoInfo[p].quarter}` : 'SIN COMPROMISO DEFINIDO';
    const last = quarterGroups[quarterGroups.length-1];
    if(last && last.label===label) last.projects.push(p);
    else quarterGroups.push({label, projects:[p]});
  });

  const colWidth = 148;
  return `
    ${topbar('Cruce APIs × Proyectos', 'Matriz de compromiso: qué proyectos han tocado cada API, en qué quarter se comprometieron y en qué estado quedó cada interacción.')}
    <div class="card">
      <div class="search-row">
        <input type="search" id="cruceSearchInput" placeholder="Filtrar por nombre, Service Domain o Business Domain…" value="${esc(cruceState.q)}" oninput="cruceState.q=this.value; reRenderKeepingFocus('cruceSearchInput');">
        <select onchange="cruceState.group=this.value; renderApp();">
          <option value="Business Domain" ${groupField==='Business Domain'?'selected':''}>Agrupar filas por Business Domain</option>
          <option value="Service Domain" ${groupField==='Service Domain'?'selected':''}>Agrupar filas por Service Domain</option>
          <option value="Tipo API" ${groupField==='Tipo API'?'selected':''}>Agrupar filas por Tipo BIAN</option>
          <option value="Estado_General_API" ${groupField==='Estado_General_API'?'selected':''}>Agrupar filas por Estado General</option>
        </select>
      </div>
      <div class="hint">${apis.length} APIs · ${proyectos.length} proyectos con actividad registrada · desplázate horizontalmente para ver todos los proyectos.</div>
      ${!proyectos.length ? `<div class="empty-state">Aún no hay registros en Histórico_Proyectos_API para construir el cruce.</div>` : `
      <div class="table-wrap" style="max-height:70vh;">
        <table style="min-width:${(proyectos.length*colWidth)+260}px;">
          <thead>
            <tr>
              <th rowspan="2" style="position:sticky;left:0;top:0;z-index:5;min-width:240px;">API / Service Domain</th>
              ${quarterGroups.map(g=>`<th colspan="${g.projects.length}" style="text-align:center;background:var(--gold-dark);">${esc(g.label)}</th>`).join('')}
            </tr>
            <tr>
              ${proyectosOrdenados.map(p=>{
                const info = proyectoInfo[p]||{};
                return `<th style="min-width:${colWidth}px;top:34px;">
                  ${info.tribu?`<span style="font-weight:400;font-size:10px;color:#9FB6C4;">${esc(info.tribu)}</span><br>`:''}
                  ${esc(p)}<br>
                  <span style="font-weight:400;font-size:10px;color:#9FB6C4;">${esc(info.lider||'')}</span>
                </th>`;
              }).join('')}
            </tr>
          </thead>
          <tbody>
            ${groupEntries.map(([g,list],gi)=>`
              <tr>
                <td colspan="${proyectosOrdenados.length+1}" style="position:sticky;left:0;background:${CRUCE_GROUP_COLORS[gi%CRUCE_GROUP_COLORS.length]};color:#fff;font-weight:700;white-space:nowrap;">${esc(g)} <span style="opacity:.8;font-weight:400;">(${list.length})</span></td>
              </tr>
              ${list.map(a=>`
              <tr>
                <td style="position:sticky;left:0;background:var(--paper-2);font-weight:600;" class="wrap">
                  ${esc(a['Nombre API']||a['Service Domain']||a['ID API'])}
                  <div style="font-weight:400;color:var(--slate-soft);font-size:11px;">${esc(a['ID API'])}${a['Service Domain']?' · '+esc(a['Service Domain']):''}</div>
                </td>
                ${proyectosOrdenados.map(p=>{
                  const h = cellMap[a['ID API']+'|'+p];
                  if(!h) return `<td></td>`;
                  const accion = h['Acción']!=='Creación' ? h['Acción'] : '';
                  return `<td>${badgeForEstadoActual(h['Estado_Actual'])}${accion?`<div style="font-size:10px;color:var(--slate-soft);margin-top:2px;">${esc(accion)}</div>`:''}</td>`;
                }).join('')}
              </tr>`).join('')}
            `).join('') || `<tr><td class="empty-state" colspan="${proyectosOrdenados.length+1}">Sin APIs para mostrar con este filtro.</td></tr>`}
          </tbody>
        </table>
      </div>`}
    </div>
  `;
}
