/* ---------------------------------------------------------------- GUÍA DE USO */
function viewGuia(){
  return `
    ${topbar('Guía de Uso', 'Cómo usar esta consola junto con el Excel maestro del Gobierno Centralizado de APIs.')}
    <div class="card guide">
      <h4>1. El Excel sigue siendo la fuente maestra</h4>
      <p>Esta consola es la interfaz de captura y consulta. Tienes dos formas de conectarla con el Excel maestro:</p>
      <div class="example">
        <b>Opción A — Edición directa (recomendada, Chrome/Edge):</b> si tu biblioteca de SharePoint está sincronizada en tu PC vía OneDrive, usa <b>"Editar archivo local (auto-guardado)"</b> y selecciona el Excel desde esa carpeta. Cada cambio que hagas en la consola se escribe automáticamente en ese mismo archivo, sin exportar ni volver a subir nada — OneDrive lo sincroniza solo hacia SharePoint.<br><br>
        <b>Opción B — Manual (cualquier navegador):</b> usa <b>Importar Excel</b> para cargar el archivo, trabaja tus cambios, y al terminar usa <b>Exportar Excel</b> para descargar la versión actualizada y reemplazarla en el repositorio compartido.
      </div>
      <p style="margin-top:10px;">La conexión directa (Opción A) se pierde si cierras la pestaña del navegador — deberás volver a conectar el archivo la próxima vez que abras la consola (es una limitación de seguridad del navegador, no de esta herramienta).</p>
      <div class="example">Además, la consola guarda un <b>borrador de trabajo</b> automáticamente (compartido entre quienes usan este enlace) para que no pierdas cambios entre sesiones — pero ese borrador nunca sustituye al Excel oficial.</div>

      <h4>2. Modelo Catálogo + Histórico</h4>
      <p>El API es un artefacto técnico (<b>Catálogo_APIs</b>) separado de las interacciones de proyectos con esa API a lo largo del tiempo (<b>Histórico_Proyectos_API</b>, una fila nueva por cada acción). Así, un proyecto puede crear un API, otro modificarla después y un tercero reutilizarla, cada uno con sus propios roles, fechas y comentarios, sin sobrescribir al anterior.</p>

      <h4>3. Orden para registrar un componente nuevo (API, microservicio, tópico o batch)</h4>
      <ol>
        <li><b>Paso 0 — Revisa el inventario:</b> usa <b>Buscar API</b> antes de mover ficha, para no crear algo que ya existe y decidir si corresponde Registrar, Modificar o Reutilizar.</li>
        <li><b>Paso 1 — Inscripción en el backlog:</b> usa <b>Registrar Componente</b> y elige primero el <b>Tipo de componente</b> (API, Microservicio, Tópico / Evento, Batch / Job u Otro) — el ID sugerido cambia de prefijo según el tipo (D para API, MS para microservicio, EVT para tópico/evento, BATCH para batch). Si es tipo API se pide además la capa BIAN; para los demás tipos ese campo se oculta. En el mismo formulario se registran sus <b>operaciones/endpoints</b> (obligatorio solo si es API) y sus <b>dependencias iniciales</b>. Queda automáticamente una fila en el Histórico con Acción = Creación.</li>
        <li><b>Paso 2 — Aviso automático:</b> al guardar, la consola muestra el aviso de que la solicitud quedó <b>Registrada</b> y a la espera de que la Torre de Control la valide (ver punto 10).</li>
      </ol>
      <p>Todos los tipos de componente se guardan en el mismo Catálogo_APIs — es la única fuente de verdad, así que una dependencia hacia un microservicio, un tópico o un batch ya registrado se selecciona del catálogo igual que una API (ver punto 11).</p>

      <h4>4. Cuando otro proyecto modifica o reutiliza un API existente</h4>
      <p>No se edita la fila anterior del histórico: se agrega una fila nueva con el mismo ID API, el nuevo proyecto y la acción correspondiente. <b>Modificar API</b> además actualiza los atributos vigentes en el Catálogo (versión, estado, descripción) y permite agregar nuevas operaciones y nuevas dependencias sobre ese mismo API. <b>Reutilizar API</b> no toca el Catálogo ni las Operaciones. Ninguna de las dos aparece como acceso directo en el menú lateral — se llega a ellas desde la ficha de un API en <b>Buscar API</b> (botones "Modificar" / "Reutilizar"), igual que en el flujo socializado: primero se revisa el inventario, y solo desde ahí se decide sobre un API puntual.</p>

      <h4>5. Acceso</h4>
      <p>Esta consola tiene un único perfil técnico, con acceso completo a todas las funciones — no hay un login separado para Arquitecto de Solución y Torre de Control. La distinción de <b>roles del flujo</b> (quién inscribe vs. quién valida) se refleja en el <b>Estado de Validación</b> de cada registro, no en permisos de la herramienta: cualquier persona con el enlace puede inscribir una solicitud o, actuando como Torre de Control, validarla desde la pestaña <b>Validar Solicitudes</b>. El control de quién hace qué en la práctica se maneja por acuerdo de equipo, igual que el control de acceso al archivo/enlace.</p>

      <h4>6. Verificación de reutilización</h4>
      <p>Antes de crear o modificar un API, el paso de verificación busca coincidencias por nombre y dominio en el catálogo, para que confirmes si conviene reutilizar o modificar un API existente en vez de crear una nueva.</p>

      <h4>7. Consultas de gobierno</h4>
      <p>La pestaña <b>Consultas</b> agrupa los reportes de apoyo: dependencias, operaciones, APIs por dominio, por capa BIAN, sin owner, sin operaciones, reutilizadas, modificadas y creadas — igual que el menú original de 18 opciones del prompt maestro.</p>

      <h4>8. Tribu y Cruce APIs × Proyectos</h4>
      <p>Cada registro de histórico ahora también captura la <b>Tribu</b> responsable del proyecto (además de Proyecto, TTL, Jefe de Proyecto y Arquitecto). Se captura en Crear, Modificar, Reutilizar y también se puede corregir después desde Actualizar Estado.</p>
      <p>La vista <b>Cruce APIs × Proyectos</b> arma una matriz: filas = APIs agrupadas por dominio/tipo/estado, columnas = proyectos agrupados por el <b>Quarter Publicación</b> comprometido (se calcula solo a partir de la Fecha Pase Producción), y bajo cada proyecto aparece la Tribu y el nombre del <b>TTL o Jefe de Proyecto</b> responsable — no el arquitecto. Cada celda muestra el estado de esa interacción específica.</p>

      <h4>9. Campos de negocio del componente</h4>
      <p>Cada Componente del Catálogo guarda: <b>Service Owner</b>, <b>Caso de Uso</b>, <b>Repositorios Involucrados</b> y <b>Excepción / Riesgo Identificado</b>. Se capturan al Registrar o Modificar el componente y se editan libremente. Los campos <b>Estado de Gobierno</b>, <b>Existe en Catálogo BIAN</b> y <b>Posible Duplicado en Backlog</b> ya <u>no</u> se autodeclaran aquí — quedaron obsoletos frente al circuito real de validación del punto 10 (Estado de Validación), que es la señal de gobierno que manda desde esta versión. Si un componente importado del Excel trae esos 3 campos con valor, la ficha los sigue mostrando como referencia histórica.</p>
      <p>Cada registro de histórico también guarda el avance de <b>5 etapas del ciclo de vida</b> (Planificación, Diseño, Desarrollo, Calidad, Producción), independiente de las fechas de pase — útil para marcar una etapa "En proceso" antes de tener fecha de cierre. Se ven como badges compactos (PLAN·DIS·DEV·QA·PROD) en la ficha del componente y en Consultar Historial. <b>Importante:</b> estas etapas están bloqueadas (solo lectura) hasta que la Torre de Control publique la solicitud — ver punto 10.</p>
      <div class="example">Usa las consultas <b>19. Excepciones / Riesgos</b> y <b>20. Gobierno por Revisar</b> para ubicar rápidamente qué componentes tienen un hallazgo de seguridad pendiente o quedaron con el antiguo Estado de Gobierno en Revisar (datos heredados del Excel).</div>

      <h4>10. Flujo de validación con la Torre de Control (socializado con los equipos)</h4>
      <p>Cada fila nueva de Histórico_Proyectos_API nace con <b>Estado de Validación = Registrado</b> y sigue este circuito:</p>
      <div class="example">
        <b>Registrado</b> → la Torre de Control la contrasta en <b>Validar Solicitudes</b> contra el estándar de gobierno (naming, duplicidad, owner de negocio, clasificación correcta).<br><br>
        · Si está <b>Correcto</b> → se marca <b>Publicado</b>: queda oficial en el inventario, la fuente única de verdad, y recién ahí se habilita continuar el flujo hacia <b>Diseño, Desarrollo, Calidad o Producción</b> (las etapas del punto 9).<br>
        · Si está <b>Observado</b> → se registra el motivo; el Arquitecto de Soluciones ve la observación en <b>Actualizar Estado y Fechas de Proyecto</b> y corrige ahí mismo <u>cualquier dato</u> que haya quedado mal: nombre, descripción, dominio de negocio, complejidad, Service Owner, fechas, Tribu, responsables, e incluso una operación mal registrada (método/path) gracias al bloque "Operaciones registradas — corrección rápida" — sin necesidad de pasar por Modificar API. Corrige <u>esa misma fila</u> (nunca crea una nueva) y la reenvía como <b>Corregido</b>, que vuelve a la cola de la Torre de Control para revalidarse.
      </div>
      <p>Al registrar o modificar un componente, la consola te lleva directo a su ficha para que confirmes visualmente que quedó en estado <b>Registrado</b> y fue enviado a la Torre de Control — no depende solo del aviso emergente (toast), que es temporal.</p>
      <p>La pestaña <b>Torre de Control → Validar Solicitudes</b> es la bandeja de revisión: agrupa todo lo pendiente (Registrado + Corregido, con etiqueta "nuevo" el mismo día del registro), lo observado y lo ya publicado, con búsqueda, filtros, botón "Ver ficha" en cada fila para revisar el componente completo antes de decidir, y las acciones ✓ Publicar / ⚠ Observar. El dashboard también avisa cuántas solicitudes están esperando validación.</p>
      <p style="color:var(--slate-soft);font-size:12px;">Nota: los registros que ya existían en el Excel antes de este cambio no tienen Estado de Validación (columna en blanco) — solo las solicitudes nuevas, creadas desde esta versión de la consola, entran al circuito Registrado → Observado/Corregido → Publicado.</p>
      <p>Además de la ficha de confirmación, el badge "nuevo" y la alerta del dashboard, al Registrar, Modificar o Reutilizar un componente la consola envía un <b>correo real</b> a la Torre de Control: llama a un pequeño relay (Cloudflare Worker) que dispara un evento en GitHub, y un GitHub Action toma ese evento y manda el correo por SMTP. Esta página no tiene backend propio, así que ese relay es indispensable — sin él, no podría notificar por correo sin exponer credenciales en el código fuente público. Ver el documento de despliegue para configurarlo (Worker + secretos del repositorio + workflow de Actions).</p>

      <h4>11. Operaciones y Dependencias: nacen en Registrar/Modificar Componente, se corrigen desde Gobierno</h4>
      <p>Las operaciones y las dependencias de un componente ya no tienen un acceso directo en el menú <b>Catálogo</b>. Se registran donde deben nacer:</p>
      <ul>
        <li><b>Registrar Componente</b> incluye los pasos "Operaciones iniciales" (obligatorio solo si el tipo es API) y "Dependencias iniciales" (siempre opcional).</li>
        <li><b>Modificar API</b> muestra las operaciones y dependencias existentes y permite agregar nuevas — no reemplaza ni borra lo ya registrado.</li>
        <li><b>Actualizar Estado y Fechas de Proyecto</b> también permite corregir una operación existente sin crear una nueva fila de histórico (ver punto 10).</li>
      </ul>
      <p><b>Registrar Operaciones</b> y <b>Registrar Dependencias</b> se movieron al grupo <b>Gobierno</b> del menú lateral: siguen existiendo, pero ahora son pantallas de corrección para cuando algo quedó mal cargado o se necesita completar después, no el punto de entrada normal.</p>
      <p>Una dependencia ya no asume que la "consumida" es siempre otra API — el inventario debe reflejar la realidad completa de integración. Al registrar una dependencia eliges primero el <b>Tipo de artefacto consumido</b>: <span class="tag">Componente del Catálogo</span> <span class="tag">Microservicio</span> <span class="tag">Evento / Topic</span> <span class="tag">Batch / Job</span> <span class="tag">Sistema Legado / Otro</span>. Con "Componente del Catálogo" seleccionas cualquier componente ya registrado (API, microservicio, tópico o batch); en cualquier otro caso escribes el nombre libremente porque todavía no está catalogado.</p>
    </div>
  `;
}

$('#modalBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='modalBackdrop') closeModal(); });
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeModal(); });

async function init(){
  renderApp();
  const had = await loadPersisted();
  if(had && PENDING_BATCH.length){
    toast(`Se recuperó tu borrador con ${PENDING_BATCH.length} componente(s) sin enviar. Revísalos y presiona "Enviar a Torre de Control".`,'info');
  } else if(githubConfigured()){
    const ok = await loadFromGitHub();
    if(ok) toast('Se cargó la versión más reciente del Excel oficial desde GitHub.','ok');
    else if(had) toast('Se recuperó tu borrador de trabajo guardado (no se pudo contactar GitHub).','ok');
  } else if(had){
    toast('Se recuperó tu borrador de trabajo guardado.','ok');
  }
  renderApp();
}
init();
</script>
